agora:
  role: worker
  id-generator:
    worker-id: 1
spring:
  application:
    name: agora
  flyway:
    locations: classpath:db/migration
  datasource:
    url: jdbc:mysql://localhost:3307/agora
    username: agora
    password: ${AGORA_DB_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED

