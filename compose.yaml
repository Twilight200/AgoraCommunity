services:
  mysql:
    profiles: [core]
    image: mysql:8.0
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${AGORA_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: agora
      MYSQL_USER: agora
      MYSQL_PASSWORD: ${AGORA_DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u$${MYSQL_USER}", "-p$${MYSQL_PASSWORD}" ]
      interval: 5s
      timeout: 3s
      retries: 20
  mysql-replica:
    profiles: [ core ]
    image: mysql:8.0
    command:
      - --server-id=2
      - --log-bin=mysql-bin
      - --relay-log=relay-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
      - --replica-preserve-commit-order=ON
      - --replica-parallel-type=LOGICAL_CLOCK
      - --replica-parallel-workers=4
      - --read-only=ON
      - --super-read-only=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${AGORA_DB_ROOT_PASSWORD}
    volumes:
      - mysql_replica_data:/var/lib/mysql
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent" ]
      interval: 5s
      timeout: 3s
      retries: 20
  api-1:
    profiles: [core]
    image: agora:local
    build: .
    environment:
      AGORA_ROLE: api
      AGORA_IDGENERATOR_WORKERID: "11"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/agora"
      SPRING_DATASOURCE_USERNAME: agora
      AGORA_DB_PASSWORD: ${AGORA_DB_PASSWORD:?AGORA_DB_PASSWORD must be set}
    ports:
      - 8081:8080
    depends_on:
      mysql:
        condition: service_healthy
  api-2:
    profiles: [ core ]
    image: agora:local
    build: .
    environment:
      AGORA_ROLE: api
      AGORA_IDGENERATOR_WORKERID: "12"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/agora"
      SPRING_DATASOURCE_USERNAME: agora
      AGORA_DB_PASSWORD: ${AGORA_DB_PASSWORD:?AGORA_DB_PASSWORD must be set}
    ports:
      - "8082:8080"
    depends_on:
      mysql:
        condition: service_healthy
  redis:
    profiles: [ core ]
    image: redis:7.4.12-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 1200mb
      - --maxmemory-policy
      - volatile-lru
      - --hash-max-listpack-entries
      - "512"
      - --hash-max-listpack-value
      - "64"
      - --list-max-listpack-size
      - "-2"
      - --set-max-intset-entries
      - "512"
      - --set-max-listpack-entries
      - "128"
      - --set-max-listpack-value
      - "64"
      - --zset-max-listpack-entries
      - "128"
      - --zset-max-listpack-value
      - "64"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20
  nginx:
    profiles: [ core ]
    image: nginx:1.30.7-alpine3.24
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
  app-worker:
    profiles: [ core ]
    image: agora:local
    build: .
    environment:
      AGORA_ROLE: worker
      AGORA_IDGENERATOR_WORKERID: "21"
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/agora"
      SPRING_DATASOURCE_USERNAME: agora
      AGORA_DB_PASSWORD: ${AGORA_DB_PASSWORD:?AGORA_DB_PASSWORD must be set}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  mysql_replica_data: