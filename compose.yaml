services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${AGORA_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: agora
      MYSQL_USER: agora
      MYSQL_PASSWORD: ${AGORA_DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u$${MYSQL_USER}", "-p$${MYSQL_PASSWORD}" ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data: